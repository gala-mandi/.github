name: Create tickets on the org board

# Reads .github/tickets/tickets.json and adds each ticket to the
# organization project board as a draft item, then sets its fields
# (Status, Side, Phase, Priority, Work Type). Tickets already on the board
# are not duplicated: a re-run only fills in an empty description or empty
# fields, so it is safe to run again after adding new tickets to the file.
# With "update_descriptions" on, descriptions that differ from tickets.json are
# replaced (only for draft items; converted issues are never touched).
#
# Needs a repository secret named PROJECT_TOKEN: a fine-grained token
# with resource owner = the organization and
# Organization permissions -> Projects: Read and write.

on:
  workflow_dispatch:
    inputs:
      project_number:
        description: "Board number (the number in the board URL: /orgs/<org>/projects/<number>)"
        required: true
        default: "1"
      dry_run:
        description: "Only show what would be created, change nothing"
        type: boolean
        default: false
      update_descriptions:
        description: "Also replace descriptions of tickets already on the board with the version in tickets.json (overwrites manual edits to those descriptions)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check token
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$PROJECT_TOKEN" ]; then
            echo "::error::Secret PROJECT_TOKEN is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Add tickets to the board
        uses: actions/github-script@v7
        env:
          ORG: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ inputs.project_number }}
          DRY_RUN: ${{ inputs.dry_run }}
          UPDATE_DESC: ${{ inputs.update_descriptions }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const fs = require('fs');
            const { tickets } = JSON.parse(fs.readFileSync('.github/tickets/tickets.json', 'utf8'));
            const ORG = process.env.ORG;
            const NUM = parseInt(process.env.PROJECT_NUMBER, 10);
            const DRY = process.env.DRY_RUN === 'true';
            const UPDATE_DESC = process.env.UPDATE_DESC === 'true';
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            const PROJECT_Q = `query($org: String!, $num: Int!) {
              organization(login: $org) {
                projectV2(number: $num) {
                  id title
                  fields(first: 50) {
                    nodes {
                      __typename
                      ... on ProjectV2FieldCommon { id name dataType }
                      ... on ProjectV2SingleSelectField { options { id name } }
                    }
                  }
                }
              }
            }`;

            async function loadProject() {
              const r = await github.graphql(PROJECT_Q, { org: ORG, num: NUM });
              const p = r.organization && r.organization.projectV2;
              if (!p) throw new Error(`Board #${NUM} not found in ${ORG}, or the token cannot see it.`);
              return p;
            }

            let project = await loadProject();
            core.info(`Board: "${project.title}" (#${NUM}) — ${tickets.length} tickets in file${DRY ? ' — DRY RUN' : ''}`);

            const fieldByName = (name) =>
              project.fields.nodes.find((f) => f.name && f.name.toLowerCase() === name.toLowerCase());

            // 1. Create any single-select fields the tickets need that the board doesn't have yet
            const COLORS = ['BLUE', 'GREEN', 'YELLOW', 'ORANGE', 'RED', 'PINK', 'PURPLE', 'GRAY'];
            const needed = {};
            for (const t of tickets) {
              for (const [k, v] of Object.entries(t.fields || {})) {
                (needed[k] = needed[k] || new Set()).add(v);
              }
            }
            let created = false;
            for (const [name, values] of Object.entries(needed)) {
              if (fieldByName(name)) continue;
              if (name === 'Status') throw new Error('Board has no Status field.');
              const options = [...values].map((v, i) => ({ name: v, color: COLORS[i % COLORS.length], description: '' }));
              core.info(`${DRY ? '[dry run] would create' : 'Creating'} field "${name}": ${[...values].join(', ')}`);
              if (!DRY) {
                await github.graphql(
                  `mutation($p: ID!, $name: String!, $opts: [ProjectV2SingleSelectFieldOptionInput!]) {
                    createProjectV2Field(input: { projectId: $p, dataType: SINGLE_SELECT, name: $name, singleSelectOptions: $opts }) {
                      projectV2Field { ... on ProjectV2SingleSelectField { id } }
                    }
                  }`,
                  { p: project.id, name, opts: options }
                );
                created = true;
              }
            }
            if (created) project = await loadProject();

            // Option names may carry emoji or prefixes ("🏔 High", "P1 · Medium"), or P0/P1/P2
            const ALIASES = { high: ['p0', 'urgent'], medium: ['p1'], low: ['p2'] };
            const norm = (s) => s.toLowerCase().replace(/[^a-z0-9& ]+/g, ' ').replace(/\s+/g, ' ').trim();
            function optionId(field, value) {
              const opts = (field && field.options) || [];
              const v = norm(value);
              // exact (ignoring emoji/punctuation), then whole-word match, then aliases
              let o = opts.find((o) => norm(o.name) === v)
                || opts.find((o) => norm(o.name).split(' ').includes(v) && v.indexOf(' ') < 0);
              if (!o) {
                for (const a of ALIASES[v] || []) {
                  o = opts.find((x) => norm(x.name) === a || norm(x.name).split(' ').includes(a));
                  if (o) break;
                }
              }
              return o ? o.id : null;
            }
            const optionNames = (field) => ((field && field.options) || []).map((o) => o.name).join(', ');

            async function setField(itemId, name, value, title, warnings) {
              const field = fieldByName(name);
              const opt = optionId(field, value);
              if (!field || !opt) {
                warnings.push(`"${title}": no option "${value}" in field "${name}" (board has: ${optionNames(field) || 'no such field'})`);
                return false;
              }
              await github.graphql(
                `mutation($p: ID!, $item: ID!, $field: ID!, $opt: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $p, itemId: $item, fieldId: $field,
                    value: { singleSelectOptionId: $opt }
                  }) { projectV2Item { id } }
                }`,
                { p: project.id, item: itemId, field: field.id, opt }
              );
              return true;
            }

            // 2. Items already on the board, with their current field values
            const existing = new Map(); // title -> { itemId, draftId, body, values: {fieldName: value} }
            let after = null;
            do {
              const r = await github.graphql(
                `query($id: ID!, $after: String) {
                  node(id: $id) { ... on ProjectV2 {
                    items(first: 50, after: $after) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        content {
                          ... on DraftIssue { id title body }
                          ... on Issue { title }
                          ... on PullRequest { title }
                        }
                        fieldValues(first: 30) { nodes {
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            name
                            field { ... on ProjectV2FieldCommon { name } }
                          }
                        } }
                      }
                    }
                  } }
                }`,
                { id: project.id, after }
              );
              const items = r.node.items;
              for (const n of items.nodes) {
                if (!n.content || !n.content.title) continue;
                const values = {};
                for (const fv of n.fieldValues.nodes) {
                  if (fv && fv.field && fv.field.name) values[fv.field.name.toLowerCase()] = fv.name;
                }
                existing.set(n.content.title, {
                  itemId: n.id,
                  draftId: n.content.body !== undefined ? n.content.id : null,
                  body: n.content.body || '',
                  values,
                });
              }
              after = items.pageInfo.hasNextPage ? items.pageInfo.endCursor : null;
            } while (after);
            core.info(`${existing.size} items already on the board`);

            // 3. Add new tickets; for ones already on the board, only fill in what is missing
            //    (an empty description, or a field with no value). Values people set are never changed.
            const rows = [];
            const warnings = [];
            let added = 0, completed = 0, unchanged = 0, failed = 0;
            for (const t of tickets) {
              const ex = existing.get(t.title);
              try {
                if (ex) {
                  const todo = [];
                  if (ex.draftId && t.body && (!ex.body.trim() || (UPDATE_DESC && ex.body.trim() !== t.body.trim()))) todo.push('description');
                  const missing = Object.entries(t.fields || {}).filter(([name]) => !ex.values[name.toLowerCase()]);
                  missing.forEach(([name]) => todo.push(name));
                  if (!todo.length) { unchanged++; rows.push([t.title, 'already complete']); continue; }
                  if (DRY) { rows.push([t.title, `would fill in: ${todo.join(', ')}`]); continue; }
                  const done = [];
                  if (todo.includes('description')) {
                    await github.graphql(
                      `mutation($d: ID!, $body: String!) {
                        updateProjectV2DraftIssue(input: { draftIssueId: $d, body: $body }) { draftIssue { id } }
                      }`,
                      { d: ex.draftId, body: t.body }
                    );
                    done.push('description');
                  }
                  for (const [name, value] of missing) {
                    if (await setField(ex.itemId, name, value, t.title, warnings)) done.push(name);
                  }
                  if (done.length) { completed++; rows.push([t.title, `filled in: ${done.join(', ')}`]); core.info(`Filled in ${done.join(', ')}: ${t.title}`); }
                  else { unchanged++; rows.push([t.title, 'nothing could be filled (see warnings)']); }
                } else {
                  if (DRY) { rows.push([t.title, 'would be added']); continue; }
                  const r = await github.graphql(
                    `mutation($p: ID!, $title: String!, $body: String) {
                      addProjectV2DraftIssue(input: { projectId: $p, title: $title, body: $body }) {
                        projectItem { id }
                      }
                    }`,
                    { p: project.id, title: t.title, body: t.body }
                  );
                  const itemId = r.addProjectV2DraftIssue.projectItem.id;
                  for (const [name, value] of Object.entries(t.fields || {})) {
                    await setField(itemId, name, value, t.title, warnings);
                  }
                  added++;
                  existing.set(t.title, { itemId, draftId: null, body: t.body, values: {} });
                  rows.push([t.title, 'added']);
                  core.info(`Added: ${t.title}`);
                }
              } catch (e) {
                failed++;
                rows.push([t.title, `FAILED: ${e.message}`]);
                core.error(`${t.title}: ${e.message}`);
              }
              await sleep(400); // stay well under GitHub's secondary rate limits
            }

            warnings.forEach((w) => core.warning(w));
            await core.summary
              .addHeading(`Tickets → ${project.title}${DRY ? ' (dry run)' : ''}`)
              .addRaw(`Added: ${added} · Filled in: ${completed} · Already complete: ${unchanged} · Failed: ${failed} · Warnings: ${warnings.length}`)
              .addTable([[{ data: 'Ticket', header: true }, { data: 'Result', header: true }], ...rows])
              .write();
            if (failed) core.setFailed(`${failed} ticket(s) failed — see the log. Re-running only fills in what is missing.`);
